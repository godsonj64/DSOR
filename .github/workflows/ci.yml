name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci-${{ matrix.python-version }}-lock.txt
      - name: Install hash-locked CPU dependencies
        run: python -m pip install --require-hashes -r requirements-ci-${{ matrix.python-version }}-lock.txt
      - name: Check imports and dependency consistency
        run: |
          python -m pip check
          python -c "import torch, torchvision, numpy; print(torch.__version__, torchvision.__version__, numpy.__version__)"
      - name: Run geometry, distribution, notebook and checkpoint tests
        run: python -m pytest -q
      - name: Record the resolved environment
        if: always()
        run: python -m pip freeze > ci-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-python-${{ matrix.python-version }}
          path: ci-environment.txt
